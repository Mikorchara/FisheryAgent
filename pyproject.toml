[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishery-ai-prototype"
version = "0.1.0"
description = "Offline-first fishery AI architecture prototype"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "Flask>=3.0,<4.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fishery_ai", "fishery_ai.*", "apps", "apps.ai_backend", "apps.ai_backend.*", "apps.ai_service", "apps.ai_service.*", "apps.knowledge", "apps.knowledge.*", "apps.monitoring", "apps.monitoring.*", "apps.simulator", "apps.simulator.*", "apps.management_web", "apps.management_web.*", "apps.qq_bot", "apps.qq_bot.*"]
exclude = ["apps.ai_backend.tests*", "apps.ai_service.tests*", "apps.ai_service.runtime.tests*", "apps.knowledge.tests*", "apps.knowledge_data*", "apps.monitoring.tests*", "apps.simulator.tests*", "apps.management_web.tests*", "apps.qq_bot.tests*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.sqlite3", "*.sqlite3-*", "*.sqlite3-journal"]

[tool.setuptools.package-dir]
fishery_ai = "src/fishery_ai"
apps = "apps"

[tool.setuptools.package-data]
fishery_ai = ["resources/knowledge/*", "resources/mock/*", "resources/scenarios/water_quality/*.json", "resources/scenarios/detection/*.json", "resources/profiles/*", "resources/tools/*.json", "resources/web/*"]
"apps.ai_service" = ["resources/*.json"]
"apps.ai_service.runtime" = ["resources/*.json"]
"apps.management_web" = ["static/*.html", "static/*.css", "static/*.js"]
