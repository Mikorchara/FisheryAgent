[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishery-ai-prototype"
version = "0.1.0"
description = "Offline-first fishery AI architecture prototype"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<3.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fishery_ai = ["resources/knowledge/*", "resources/mock/*"]
