[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishery-ai-prototype"
version = "0.1.0"
description = "Offline-first fishery AI architecture prototype"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "Flask>=3.0,<4.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fishery_ai", "fishery_ai.*", "apps", "apps.ai_backend", "apps.ai_backend.*"]
exclude = ["apps.ai_backend.tests", "apps.ai_backend.tests.*"]

[tool.setuptools.package-dir]
fishery_ai = "src/fishery_ai"
apps = "apps"

[tool.setuptools.package-data]
fishery_ai = ["resources/knowledge/*", "resources/mock/*", "resources/scenarios/water_quality/*.json", "resources/scenarios/detection/*.json", "resources/profiles/*", "resources/tools/*.json", "resources/web/*"]
