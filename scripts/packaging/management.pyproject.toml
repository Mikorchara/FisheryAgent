# Standalone management distribution. The mixed repository pyproject is unchanged.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishery-management"
version = "0.1.0"
description = "Local fishery management application"
requires-python = ">=3.11"
dependencies = ["openai>=1.0,<3.0", "httpx>=0.27,<1.0", "python-dotenv>=1.0,<2.0", "Flask>=3.0,<4.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["apps", "apps.ai_backend", "apps.ai_backend.*", "apps.ai_service", "apps.ai_service.*", "apps.knowledge", "apps.knowledge.*", "apps.monitoring", "apps.monitoring.*", "apps.simulator", "apps.simulator.*", "apps.management_web", "apps.management_web.*"]
exclude = ["*.tests", "*.tests.*", "apps.knowledge_data*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.sqlite3*", "*.env", "*.jsonl", "*.pyc"]

[tool.setuptools.package-data]
"apps.ai_service" = ["resources/*.json"]
"apps.ai_service.runtime" = ["resources/*.json"]
"apps.management_web" = ["static/*.html", "static/*.css", "static/*.js"]
